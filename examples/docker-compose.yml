# Example compose file: freentonic + simplefreen + a Caddy TLS
# sidecar, all on a shared Docker network. Copy to your deployment
# and fill in secrets via an adjacent `.env` file or a secrets
# manager.
#
# ─── DEV-MODE DEPLOYMENT ─────────────────────────────────────────
# This stack serves simplefreen at https://simplefreen.localhost on
# port 443, with a self-signed cert minted by Caddy's bundled local
# CA. That is enough for stock `actualbudget/actual-server` to talk
# to it, BUT the cert is not publicly trusted — your browser and
# Actual need to trust Caddy's root CA once. See
# `docs/development.md` for the trust-store walk-through.
#
# This is still a dev-mode deployment: the cert is not in any public
# trust store, the host is `*.localhost`, and the `.env` keeps
# secrets in plaintext on disk. Do not use on the open internet.
#
# Before going live, read
# `docs/operator-guide.md#production-deployment` — the short version:
#   - point SIMPLEFREEN_PUBLIC_URL at a publicly-resolvable hostname
#     with a publicly-trusted cert (Let's Encrypt / your CA)
#   - put simplefreen behind a TLS-terminating reverse proxy that
#     handles cert issuance (Caddy ACME, Traefik, an ALB, …)
#   - keep simplefreen and freentonic on the internal network only;
#     the proxy is the sole public surface
# ─────────────────────────────────────────────────────────────────

services:
  freentonic:
    image: freentonic:latest
    container_name: freentonic
    restart: unless-stopped
    networks:
      default:
        aliases: [freentonic]
    ports:
      - "127.0.0.1:7878:7878"   # /invoke API
      - "127.0.0.1:17080:6080"   # noVNC (only needed if FREENTONIC_VNC=1) — host port off-default to avoid collisions
    volumes:
      - ${FREENTONIC_WORKFLOWS_DIR:-./freentonic-workflows}:/home/freentonic/workflows:ro
      - ${FREENTONIC_RUNS_DIR:-./freentonic-runs}:/workspace/runs
      - freentonic_chrome_profile:/home/freentonic/.cache/freentonic/chrome
    shm_size: "256m"
    environment:
      FREENTONIC_INVOKE_TOKEN: "${FREENTONIC_INVOKE_TOKEN}"
      FREENTONIC_VNC: "1"

  simplefreen:
    image: simplefreen:latest
    container_name: simplefreen
    restart: unless-stopped
    depends_on:
      - freentonic
    networks:
      default:
        aliases: [simplefreen]
    # No host port published — the Caddy sidecar is the only public
    # surface. simplefreen stays reachable inside the network as
    # `simplefreen:7878`.
    volumes:
      - ${SIMPLEFREEN_DIR:-./simplefreen-data}:/data
      # Workflow YAMLs — same dir freentonic mounts read-only, but
      # we mount it read-write here so the admin UI's "Refresh
      # workflows" button can pull a fresh tarball from
      # github.com/GermanDZ/freentonic-providers and lay it down. If
      # you don't want admin-driven runtime updates of workflow code
      # (e.g. tighter prod posture), append `:ro` and don't expose
      # the refresh action through your reverse proxy's allowlist.
      - ${FREENTONIC_WORKFLOWS_DIR:-./freentonic-workflows}:/workflows
      # Read-only view of the same per-run output directory freentonic
      # writes screenshots, logs, and exports to. Used by the admin
      # UI's run-artifact gallery so debugging a failed scrape doesn't
      # require shelling into the host filesystem.
      - ${FREENTONIC_RUNS_DIR:-./freentonic-runs}:/workspace/runs:ro
    environment:
      SIMPLEFREEN_SECRETS_KEY:    "${SIMPLEFREEN_SECRETS_KEY}"
      SIMPLEFREEN_ADMIN_PASSWORD: "${SIMPLEFREEN_ADMIN_PASSWORD}"
      # Public URL Actual sees. Defaults to the dev hostname Caddy
      # serves; override in `.env` for production.
      SIMPLEFREEN_PUBLIC_URL:        "${SIMPLEFREEN_PUBLIC_URL:-https://simplefreen.localhost}"
      # Internal URL freentonic POSTs to on /push/<run_id>. Stays on
      # plain HTTP inside the Docker network — the callback never
      # leaves the network so it does not need to traverse Caddy.
      SIMPLEFREEN_INTERNAL_PUSH_URL: "http://simplefreen:7878"
      SIMPLEFREEN_CORS_ALLOWED_ORIGINS: "${SIMPLEFREEN_CORS_ALLOWED_ORIGINS:-}"
      # Freentonic health probe cadence. Default in code is 5 minutes
      # (production-friendly); dev wants faster recovery after a
      # `docker compose up -d freentonic` restart, so the dev compose
      # ships 20s. Override for prod via .env if you want a different
      # cadence, or unset to fall back to the in-code 5-minute default.
      SIMPLEFREEN_FREENTONIC_HEALTH_INTERVAL_SECONDS: "${SIMPLEFREEN_FREENTONIC_HEALTH_INTERVAL_SECONDS:-20}"
      FREENTONIC_URL:                "http://freentonic:7878"
      FREENTONIC_INVOKE_TOKEN:        "${FREENTONIC_INVOKE_TOKEN}"

  caddy:
    image: caddy:2-alpine
    container_name: simplefreen-caddy
    restart: unless-stopped
    depends_on:
      - simplefreen
    networks:
      default:
        # Make `simplefreen.localhost` resolve inside the Docker
        # network too, so any in-network client (e.g. an Actual
        # container an operator wires in) reaches the same URL.
        aliases: [simplefreen.localhost]
    ports:
      - "127.0.0.1:443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  freentonic_chrome_profile:
  caddy_data:
  caddy_config:

networks:
  default:
    name: simplefreen_default
